name: Rebuild main.py module split

on:
  push:
    branches:
      - agent/modularize-main-v2

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch base branch
        run: git fetch origin main --depth=1
      - name: Rebuild modules from main.py
        run: python scripts/resplit_main.py
      - name: Validate syntax
        run: python -m compileall -q main.py config.py session.py model.py mcp.py process.py tools.py cli.py
      - name: Validate module boundaries
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          expected = {
              'main.py': ['run_agent', 'plan_user_request', 'handle_task_end_command'],
              'cli.py': ['interactive_loop', 'build_cli_parser'],
              'model.py': ['chat_once'],
              'mcp.py': ['discover_mcp_tools', 'run_mcp_tool'],
              'process.py': ['run_subprocess_command'],
              'tools.py': ['execute_tool_call'],
              'session.py': ['SessionStore', 'ConversationRecorder'],
              'config.py': ['t', 'ensure_config'],
          }
          for path, names in expected.items():
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              found = {n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))}
              missing = set(names) - found
              assert not missing, f'{path}: missing {sorted(missing)}'
          print('Module boundary validation passed')
          PY
      - name: Remove temporary refactor files
        run: rm scripts/resplit_main.py .github/workflows/resplit-main.yml
      - name: Commit corrected split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py config.py session.py model.py mcp.py process.py tools.py cli.py scripts/resplit_main.py .github/workflows/resplit-main.yml
          git commit -m 'refactor: keep agent orchestration in main.py'
          git push
