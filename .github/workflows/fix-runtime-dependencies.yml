name: Validate modularized runtime dependencies

on:
  push:
    branches:
      - agent/modularize-main-v2

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fix runtime imports
        run: python scripts/fix_runtime_dependencies.py
      - name: Rename MCP integration module
        run: |
          git mv mcp.py mcp_tools.py
          sed -i 's/from mcp import /from mcp_tools import /g' main.py model.py tools.py
      - name: Validate syntax
        run: python -m compileall -q main.py config.py session.py model.py mcp_tools.py process.py tools.py cli.py
      - name: Smoke import modules
        run: python -c "import config; import session; import mcp_tools; import process; import tools; import model; import cli; import main; print('module import smoke test passed')"
      - name: Remove temporary files
        run: rm scripts/fix_runtime_dependencies.py .github/workflows/fix-runtime-dependencies.yml
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py cli.py model.py mcp_tools.py process.py tools.py scripts/fix_runtime_dependencies.py .github/workflows/fix-runtime-dependencies.yml
          git commit -m 'fix: resolve modularized runtime dependencies'
          git push
