name: Apply main.py modularization

on:
  push:
    branches:
      - agent/modularize-main-v2

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Split main.py
        run: python scripts/split_main.py
      - name: Validate syntax
        run: python -m compileall -q main.py config.py session.py model.py mcp.py process.py tools.py cli.py
      - name: Validate imports
        run: python - <<'PY'
          import ast
          from pathlib import Path
          for name in ['main.py','config.py','session.py','model.py','mcp.py','process.py','tools.py','cli.py']:
              ast.parse(Path(name).read_text(encoding='utf-8'))
          print('AST validation passed')
          PY
      - name: Remove temporary refactor files
        run: rm scripts/split_main.py .github/workflows/apply-modularization.yml
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py config.py session.py model.py mcp.py process.py tools.py cli.py scripts/split_main.py .github/workflows/apply-modularization.yml
          git commit -m 'refactor: split main.py by responsibility'
          git push
